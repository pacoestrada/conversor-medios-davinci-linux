name: Comprobar y publicar versión
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'packaging/**'
      - 'tests/**'
      - 'docs/releases/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias de pruebas
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-tk xvfb x11-xserver-utils rpm
      - name: Comprobar motor y conversiones
        run: |
          bash -n src/conversor-medios
          python3 -m py_compile src/conversor-gui.py
          bash tests/test_v2.sh
          bash tests/test_v2_2.sh
      - name: Comprobar monitores e interfaz HiDPI
        run: |
          python3 tests/test_monitor_area.py
          xvfb-run -a -s "-screen 0 1366x768x24 -dpi 96" python3 tests/test_gui.py
          xvfb-run -a -s "-screen 0 1920x1080x24 -dpi 96" python3 tests/test_gui.py
          TEST_SCALE=2.666666667 TEST_DESKTOP_FONT=72 xvfb-run -a -s "-screen 0 3840x2160x24 -dpi 192" python3 tests/test_gui.py
      - name: Construir instaladores
        run: |
          bash packaging/build-deb.sh
          bash packaging/build-rpm.sh
      - name: Publicar release e instalador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^Version: //p' packaging/debian/control)
          tag="v$version"
          package="dist/conversor-mp4-mov_${version}_all.deb"
          rpm_package="dist/conversor-mp4-mov-${version}-1.noarch.rpm"
          (cd dist && sha256sum "$(basename "$package")" "$(basename "$rpm_package")") > "dist/SHA256SUMS.txt"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "La release $tag ya existe; no se modifica."
          else
            gh release create "$tag" "$package" "$rpm_package" dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "Conversor de medios $version" \
              --notes-file "docs/releases/$tag.md"
          fi
